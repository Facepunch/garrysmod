<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Loading..</title>
		<link rel="stylesheet" type="text/css" href="css/Loading.css" />
	</head>
	<body>
		<div id="background">
			<div id="container">
				<img id="logo" src="img/gmod_logo_brave.png" alt="" />
				<div>
					<div class="walk">:v</div>
				</div>
			</div>

			<div class="server-info">
				<img id="mapimg" src="asset://mapimage/invalid_map" alt="" />
				<div class="text">
					<div id="serverName"></div>
					<div id="serverMap"></div>
					<div id="serverGamemode"></div>
				</div>
			</div>

			<div id="spambox"></div>
		</div>

		<script type="text/javascript">
			function addClass(element, name) {
				var cls = element.className || "";
				if ((" " + cls + " ").indexOf(" " + name + " ") === -1)
					element.className = (cls + " " + name).trim();
			}

			document.addEventListener("DOMContentLoaded", function () {
				var today = new Date();

				var isHalloween =
					(today.getMonth() == 9 && today.getDate() >= 15) ||
					(today.getMonth() == 10 && today.getDate() <= 5);
				var darkMode =
					today.getHours() >= 19 || today.getHours() <= 7;

				const versionMatch = navigator.userAgent.match(/Chrome\/(\d+)/);
				const supportsSystemDarkMode =
					versionMatch && parseInt(versionMatch[1]) >= 76;
				var systemDarkMode = window.matchMedia(
					"(prefers-color-scheme: dark)",
				).matches;

				if (
					isHalloween ||
					(supportsSystemDarkMode ? systemDarkMode : darkMode)
				) {
					addClass(document.body, "dark");
				}
			});

			function GameDetails(
				servername,
				serverurl,
				mapname,
				maxplayers,
				steamid,
				gamemode,
				volume,
				lang,
				gamemodeNice,
			) {
				var mapImg = "asset://mapimage/" + mapname;

				document.querySelector("#serverName").innerText = servername;
				document.querySelector("#serverMap").innerText = mapname;
				document.querySelector("#serverGamemode").innerText =
					gamemodeNice;
				document.querySelector("#mapimg").setAttribute("src", mapImg);
				document.body.style.backgroundImage = "url('" + mapImg + "')";

				addClass(
					document.querySelector(".server-info"),
					"visible",
				);
			}

			function DownloadingFile(file) {
				if (window.OnFileDownloading) OnFileDownloading(file);
			}

			function SetStatusChanged(status) {
				if (window.OnStatusChanged) OnStatusChanged(status);
			}

			function SetFilesNeeded(needed) {
				if (window.OnFilesNeeded) OnFilesNeeded(needed);
			}

			function SetFilesTotal(total) {
				if (window.OnFilesTotal) OnFilesTotal(total);
			}
		</script>
	</body>
</html>
