
<div class="page" ng-controller="ControllerDupes">
	<style type="text/css">
		workshopicon 
		{
			width: {{IconWidth}}px; 
			height: {{IconHeight}}px;
		}
	</style>

	<div style="position: absolute; left: 0px; top: 0px; bottom: 0px; right: 0px;">

		<workshopcontainer>

			<workshopmessage ng-show="Loading" ng-Localize="'dupes.loading'">...</workshopmessage>
			<workshopmessage ng-show="( TotalResults == 0 || NumResults == 0 ) && !Loading" ng-Localize="'dupes.none'">...</workshopmessage>

			<workshopicon ng-hide="Loading" ng-repeat="file in Files">

				<preview>
					<img ng-if="file.background" ng-src="../{{file.background}}" loading="lazy"/>
				</preview>

				<name>
					<label ng-click="OpenWorkshopFile( file.id )">
						<span ng-if="!file.info.blocked">{{file.info.title}}</span>
						<span ng-if="file.info.blocked" ng-Localize="'ugc.blocked_title'"></span>
						<span ng-if="!file.info.title" ng-Localize="'ugc.loading'"></span>
					</label>
				</name>

				<author ng-hide="file.local">{{file.info.ownername}}<span ng-if="!file.info.ownername" ng-Localize="'ugc.loading'"></span></author>

				<votes ng-show="!file.local && (file.vote.up-file.vote.down) > 0" style="color: #4a4">+{{file.vote.up-file.vote.down|number:0}}</votes>
				<votes ng-show="!file.local && (file.vote.up-file.vote.down) < 0" style="color: #a44">{{file.vote.up-file.vote.down|number:0}}</votes>

				<description ng-if="!file.info.blocked">{{file.info.description}}</description>
				<description ng-if="file.info.blocked" ng-Localize="'ugc.blocked_desc'"></description>

				<controls>

					<left>
					<!--
						<control ng-hide="file.local || file.rated" ng-click="Rate( file, true )"><img src='img/thumb-up.png' /></control>
						<control ng-hide="file.local || file.rated" ng-click="Rate( file, false )"><img src='img/thumb-down.png' /></control>
					-->
						<control ng-show="file.local" ng-click="PublishLocal( file )" ng-Localize="'dupes.publish'">..</control>
						<control ng-show="!file.local" ng-click="OpenWorkshopFile( file.id )" ng-Localize="'dupes.commentandrate'">..</control>

					</left>

					<right>
						<control ng-click="ArmDupe( file )" ng-Localize="'dupes.arm'">..</control>
					</right>

				</controls>

			</workshopicon>

			<center>
				<pagination ng-hide="Loading || TotalResults == 0">

					<a class="back" ng-click="Go( PerPage * -1 )">&nbsp;</a>
					<a class="next" ng-click="Go( PerPage * 1 )">&nbsp;</a>

					<div class="pages">
						<span ng-repeat="p in Pages"><a class="page" ng-class="{ 'active': (p == Page) }" ng-click="GoToPage( p )"><img src='img/pagination_page.png?1' /></a></span><br>
					</div>
					<span class="pagenum">{{Page}}</span>

				</pagination>
			</center>

		</workshopcontainer>

	</div>

</div>
