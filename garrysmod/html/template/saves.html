
<div class="page" ng-controller="ControllerSaves">
	<style type="text/css">
		workshopicon 
		{
			width: {{IconWidth}}px; 
			height: {{IconHeight}}px;
		}
	</style>

	<div class="options">

		<ul>

			<li><h2 ng-Localize="'saves'"></h2></li>

			<li ng-repeat="cat in MyCategories" class="clickable" ng-class="[ Category == cat ? 'active' : 'notactive' ]">
				<a ng-click="Switch( cat, 0 )" ng-Localize="'saves.'+cat" ng-show="cat != ''" ng-class="[ Category == cat ? 'active' : 'notactive' ]"></a>

				<ul ng-show="Category == cat && cat != 'local'" style="margin-top: 4px; margin-bottom: 15px;">
					<li ng-repeat="tag in SubCategories" class="clickable" ng-class="[ Tagged == tag ? 'active' : 'notactive' ]">
						<a ng-click="SwitchWithTag( cat, 0, tag )" ng-Localize="'saves.'+tag" ng-show="tag != ''" ng-class="[ Tagged == tag ? 'active' : 'notactive' ]">{{subcat}}</a>
					</li>
				</ul>
			</li>

			<li>&nbsp;</li>

			<li ng-repeat="cat in Categories" class="clickable" ng-class="[ Category == cat ? 'active' : 'notactive' ]">
				<a ng-click="Switch( cat, 0 )" ng-Localize="'saves.'+cat" ng-show="cat != ''" ng-class="[ Category == cat ? 'active' : 'notactive' ]"></a>

				<ul ng-show="Category == cat" style="margin-top: 4px; margin-bottom: 15px;">
					<li ng-repeat="tag in SubCategories" class="clickable" ng-class="[ Tagged == tag ? 'active' : 'notactive' ]">
						<a ng-click="SwitchWithTag( cat, 0, tag )" ng-Localize="'saves.'+tag" ng-show="tag != ''" ng-class="[ Tagged == tag ? 'active' : 'notactive' ]">{{subcat}}</a>
					</li>
				</ul>
			</li>

			<li>&nbsp;</li>

			<li ng-repeat="cat in CategoriesSecondary" class="clickable" ng-class="[ Category == cat ? 'active' : 'notactive' ]">
				<a ng-click="Switch( cat, 0 )" ng-Localize="'saves.'+cat" ng-show="cat != ''" ng-class="[ Category == cat ? 'active' : 'notactive' ]"></a>

				<ul ng-show="Category == cat" style="margin-top: 4px; margin-bottom: 15px;">
					<li ng-repeat="tag in SubCategories" class="clickable" ng-class="[ Tagged == tag ? 'active' : 'notactive' ]">
						<a ng-click="SwitchWithTag( cat, 0, tag )" ng-Localize="'saves.'+tag" ng-show="tag != ''" ng-class="[ Tagged == tag ? 'active' : 'notactive' ]">{{subcat}}</a>
					</li>
				</ul>
			</li>

			<li>&nbsp;</li>

			<li><a ng-click="OpenFolder( 'saves' )" ng-Localize="'saves.openfolder'"></a></li>

		</ul>

	</div>

	<div class="ugc_content">

		<h1 class="menuheader"><span ng-Localize="'saves.'+Category">...</span><small ng-Localize="'saves.'+Category + '.subtitle'">...</small></h1>

		<workshopcontainer>

			<workshopmessage ng-show="Loading" ng-Localize="'saves.loading'">...</workshopmessage>
			<workshopmessage ng-show="( TotalResults == 0 || NumResults == 0 ) && !Loading && ( !Disabled || Category != 'subscribed_ugc' )" ng-Localize="'saves.none'">...</workshopmessage>
			<workshopmessage ng-show="TotalResults == 0 && !Loading && Disabled && Category == 'subscribed_ugc'" ng-Localize="'ugc.disabled'">...</workshopmessage>

			<workshopicon ng-hide="Loading" ng-repeat="file in Files" ng-class="{ 'installed': IsSubscribed( file ) }">

				<preview>
					<img ng-if="file.background" ng-src="../{{file.background}}" loading="lazy"/>
				</preview>

				<name>
					<label ng-click="OpenWorkshopFile( file.id )">
						<span ng-if="!file.info.blocked">{{file.info.title}}</span>
						<span ng-if="file.info.blocked" ng-Localize="'ugc.blocked_title'"></span>
						<span ng-if="!file.info.title" ng-Localize="'ugc.loading'"></span>
					</label>
				</name>
				<author ng-hide="file.local">{{file.info.ownername}}<span ng-if="!file.info.ownername" ng-Localize="'ugc.loading'"></span></author>
				<votes ng-show="!file.local && (file.info.up-file.info.down) > 0" style="color: #4a4">+{{file.info.up-file.info.down|number:0}}</votes>
				<votes ng-show="!file.local && (file.info.up-file.info.down) < 0" style="color: #a44">{{file.info.up-file.info.down|number:0}}</votes>
				<description ng-if="!file.info.blocked">{{file.info.description}}</description>
				<description ng-if="file.info.blocked" ng-Localize="'ugc.blocked_desc'"></description>

				<controls>

					<left>
						<control ng-class="{ 'disabled': file.info.voted_up }" ng-hide="file.local" ng-click="Rate( file, true )"><img src='img/thumb-up.png' loading="lazy"/></control>
						<control ng-class="{ 'disabled': file.info.voted_down }" ng-hide="file.local" ng-click="Rate( file, false )"><img src='img/thumb-down.png' loading="lazy"/></control>
						<control ng-hide="file.local || file.info.favorite" ng-click="Favorite( file, true )"><img src='img/favourite_addon.png' loading="lazy"/></control>
						<control ng-hide="file.local || !file.info.favorite" ng-click="Favorite( file, false )"><img src='img/favourite_addon_remove.png' loading="lazy"/></control>
						<control ng-show="file.local" ng-click="PublishLocal( file )" ng-Localize="'saves.publish'">..</control>
						<control ng-show="file.local" ng-click="DeleteLocal( file )" ng-Localize="'saves.delete'">..</control>
					</left>

					<right>
						<control ng-show="!file.local && !IsSubscribed( file ) && !Disabled" ng-click="Subscribe( file )" ng-Localize="'ugc.subscribe'">..</control>
						<control ng-show="!file.local && IsSubscribed( file )" ng-click="Unsubscribe( file )" ng-Localize="'ugc.unsubscribe'">..</control>
						<control ng-click="LoadSave( file )" ng-Localize="'saves.load'">..</control>
					</right>

				</controls>

			</workshopicon>

			<center>
				<pagination ng-hide="Loading || TotalResults == 0">
					<a class="back" ng-click="Go( PerPage * -1 )">&nbsp;</a>
					<a class="next" ng-click="Go( PerPage * 1 )">&nbsp;</a>

					<div class="pages">
						<span ng-repeat="p in Pages"><a class="page" ng-class="{ 'active': (p == Page) }" ng-click="GoToPage( p )"><img src='img/pagination_page.png?1' /></a></span><br>
					</div>
					<span class="pagenum">{{Page}}</span>
				</pagination>
			</center>

		</workshopcontainer>

	</div>

</div>
